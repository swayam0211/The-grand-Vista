<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grand Vista — Parallax Canvas in Motion</title>
  <meta name="description"
    content="An immersive museum-grade parallax scrolling exhibition brought to life with Lenis and GSAP.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- Lenis CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Fixed Museum HUD / Navigation Overlay -->
  <header class="museum-hud">
    <div class="hud-brand">
      <span class="hud-tag">EXHIBITION</span>
      <h1 class="hud-title">THE GRAND VISTA</h1>
    </div>

    <div class="hud-controls">
      <button id="replay-curtain-btn" class="hud-btn" title="Replay Cloud Opening">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
        </svg>
        <span>REPLAY INTRO</span>
      </button>

      <div class="hud-depth-indicator">
        <span class="depth-label">DEPTH</span>
        <span id="scroll-percent">0%</span>
      </div>
    </div>
  </header>

  <!-- Side Parallax Scene Indicator -->
  <nav class="scene-nav" aria-label="Scene Navigation">
    <div class="nav-dot active" data-scene="1" title="Scene I: The Canopy Sky"><span>I</span></div>
    <div class="nav-dot" data-scene="2" title="Scene II: Silhouettes & Horizon"><span>II</span></div>
    <div class="nav-dot" data-scene="3" title="Scene III: The Railway Bridge"><span>III</span></div>
    <div class="nav-dot" data-scene="4" title="Scene IV: Sprawling Citadel"><span>IV</span></div>
    <div class="nav-dot" data-scene="5" title="Scene V: Minaret & European Skyline"><span>V</span></div>
  </nav>

  <!-- Scroll Container for Lenis -->
  <div class="scroll-wrapper">
    <!-- Main Parallax Canvas (1440px x 8592px) -->
    <main id="parallax-canvas" class="parallax-canvas">

      <!-- ================= BACKGROUND LAYERS ================= -->
      <!-- Top Half Background -->
      <img src="images from figma/layer-2-1595x5548.png" id="bg-top" class="p-layer bg-layer"
        style="left:-77px; top:0px; width:1595px; height:5548px;" alt="Sky Background Top">

      <!-- Bottom Half Background (Flipped 180 deg) -->
      <img src="images from figma/layer-1-1595x5548.png" id="bg-bottom" class="p-layer bg-layer bg-flipped"
        style="left:-77px; top:5548px; width:1595px; height:5548px;" alt="Sky Background Bottom">

      <!-- Dark Atmosphere Transition Band -->
      <img src="images from figma/rectangle-1.png" id="atmosphere-band" class="p-layer mid-layer"
        style="left:25px; top:5330px; width:1440px; height:836px;" alt="Atmospheric Layer">

      <!-- ================= SCENE 1: CANOPY & FLOATING CLOUDS (Y: 0 - 1400) ================= -->
      <!-- Giant Top Tree Canopy Attachment -->
      <img src="images from figma/trees-top-section.png" id="tree-top-canopy" class="p-layer canopy-layer"
        style="left:0px; top:0px; width:1440px; height:554px;" alt="Tree Canopy Top">

      <!-- Foreground Left Bare Tree -->
      <img src="images from figma/tree-bare-left.png" id="tree-bare-left" class="p-layer fg-layer"
        style="left:-53px; top:2px; width:1323px; height:2596px;" alt="Bare Tree Left">

      <!-- Right Giant Tree Overlay -->
      <img src="images from figma/trees-giant-overlay.png" id="trees-giant-overlay" class="p-layer fg-layer"
        style="left:660px; top:0px; width:919px; height:1578px;" alt="Giant Tree Overlay Right">

      <!-- Floating Sky Cloud Cutouts (Layered Depth) -->
      <img src="images from figma/image-15.png" class="p-layer sky-cloud"
        style="left:-7px; top:33px; width:725px; height:394px;" data-depth="0.6" alt="Cloud Cutout">
      <img src="images from figma/image-14.png" class="p-layer sky-cloud"
        style="left:308px; top:17px; width:569px; height:316px;" data-depth="0.9" alt="Cloud Cutout">
      <img src="images from figma/image-13.png" class="p-layer sky-cloud"
        style="left:861px; top:80px; width:593px; height:329px;" data-depth="0.4" alt="Cloud Cutout">
      <img src="images from figma/image-12.png" class="p-layer sky-cloud"
        style="left:398px; top:230px; width:645px; height:358px;" data-depth="1.2" alt="Cloud Cutout">
      <img src="images from figma/image-10.png" class="p-layer sky-cloud"
        style="left:-7px; top:288px; width:437px; height:242px;" data-depth="0.7" alt="Cloud Cutout">
      <img src="images from figma/image-9.png" class="p-layer sky-cloud"
        style="left:860px; top:339px; width:573px; height:318px;" data-depth="1.4" alt="Cloud Cutout">
      <img src="images from figma/image-5.png" class="p-layer sky-cloud"
        style="left:278px; top:374px; width:661px; height:360px;" data-depth="0.5" alt="Cloud Cutout">
      <img src="images from figma/image-18.png" class="p-layer sky-cloud"
        style="left:827px; top:447px; width:661px; height:360px;" data-depth="1.1" alt="Cloud Cutout">
      <img src="images from figma/image-8.png" class="p-layer sky-cloud"
        style="left:568px; top:554px; width:661px; height:360px;" data-depth="0.8" alt="Cloud Cutout">
      <img src="images from figma/image-11.png" class="p-layer sky-cloud"
        style="left:18px; top:554px; width:630px; height:350px;" data-depth="1.5" alt="Cloud Cutout">
      <img src="images from figma/image-17.png" class="p-layer sky-cloud"
        style="left:679px; top:600px; width:739px; height:410px;" data-depth="0.65" alt="Cloud Cutout">
      <img src="images from figma/image-7.png" class="p-layer sky-cloud"
        style="left:718px; top:627px; width:958px; height:522px;" data-depth="1.3" alt="Cloud Cutout">
      <img src="images from figma/image-6.png" class="p-layer sky-cloud"
        style="left:-7px; top:734px; width:661px; height:360px;" data-depth="0.45" alt="Cloud Cutout">
      <img src="images from figma/image-16.png" class="p-layer sky-cloud"
        style="left:245px; top:744px; width:914px; height:498px;" data-depth="1.6" alt="Cloud Cutout">

      <!-- ================= SCENE 2: SILHOUETTES & CITY INTRO (Y: 1400 - 2800) ================= -->
      <!-- Two Figures Silhouetted on Cliff -->
      <img src="images from figma/two-figures-silhouette.png" id="figures-silhouette" class="p-layer fg-layer"
        style="left:576px; top:1450px; width:144px; height:157px;" alt="Two Figures Silhouette">

      <!-- First City Artwork (Slides in from Right) -->
      <img src="images from figma/city-right-intro.png" id="city-right-intro" class="p-layer mid-layer"
        style="left:354px; top:1596px; width:1225px; height:1204px;" alt="City Intro Right">

      <!-- Birds Flock Static Image -->
      <img src="images from figma/birds-flock-sky.png" id="birds-flock-static" class="p-layer sky-layer"
        style="left:-7px; top:2440px; width:667px; height:667px;" alt="Birds Flock Sky">

      <!-- Interactive Birds Animated Canvas Overlays -->
      <canvas id="birds-canvas-top" class="p-layer video-canvas"
        style="left:0px; top:1500px; width:1440px; height:600px; pointer-events:none;"></canvas>
      <canvas id="birds-canvas" class="p-layer video-canvas"
        style="left:0px; top:2500px; width:1440px; height:600px; pointer-events:none;"></canvas>

      <!-- ================= SCENE 3: RAILWAY BRIDGE & TRAIN JOURNEY (Y: 2800 - 4200) ================= -->
      <!-- Interactive Scroll-Controlled Train Canvas -->
      <canvas id="train-canvas" class="p-layer video-canvas"
        style="left:-25px; top:2817px; width:1455px; height:651px; pointer-events:none;"></canvas>

      <!-- Lower Valley City Panorama -->
      <img src="images from figma/city-panorama-lower.png" id="city-panorama-lower" class="p-layer bg-depth-layer"
        style="left:-187px; top:2515px; width:1663px; height:737px;" alt="Lower City Panorama">

      <!-- ================= SCENE 4: CITADEL ARCHITECTURE (Y: 4200 - 6300) ================= -->
      <!-- Sprawling Citadel Buildings -->
      <img src="images from figma/building-cluster-large.png" id="building-cluster-large" class="p-layer mid-layer"
        style="left:-30px; top:3796px; width:750px; height:890px;" alt="Large Citadel Cluster">

      <!-- Mixed Architecture Layer -->
      <img src="images from figma/building-cluster-mixed.png" id="building-cluster-mixed" class="p-layer bg-depth-layer"
        style="left:-103px; top:3787px; width:1373px; height:1163px;" alt="Mixed Architecture Cluster">

      <!-- Mathematical Blueprint & Architectural Geometry Canvas Overlay (Scenes 4 & 5) -->
      <canvas id="geometry-canvas" class="p-layer video-canvas"
        style="left:0px; top:3300px; width:1440px; height:3300px; pointer-events:none; z-index:12;"></canvas>

      <!-- ================= SCENE 5: SKETCH & WATER-DROP FLUID COLOR REVEAL (Y: 5445) ================= -->
      <canvas id="section-5-canvas" class="p-layer mid-layer" width="1440" height="900"
        style="left:0px; top:5000px; width:1440px; height:900px; pointer-events:none; z-index:15;"></canvas>

    </main>
  </div>

  <!-- ==========================================================================
       VISUAL PARALLAX EDITOR PANEL (Hidden by Default)
       ========================================================================== -->
  <div id="parallax-editor" class="editor-panel hidden"
    style="resize: both; overflow: auto; min-width: 380px; min-height: 400px; padding-bottom: 30px;">
    <div class="editor-header" id="editor-drag-handle" style="cursor: grab; user-select: none;">
      <h3 style="pointer-events: none;">Visual Editor</h3>
      <button id="close-editor-btn" class="icon-btn" style="cursor: pointer;">&times;</button>
    </div>

    <div class="editor-body">
      <div class="editor-group" style="margin-bottom: 20px;">
        <label>Selected Layer</label>
        <select id="editor-target-dropdown"
          style="width: 100%; padding: 8px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--gold-primary); border-radius: 4px; outline: none; font-size: 0.8rem;">
          <option value="">-- Click an image or select here --</option>
        </select>
      </div>

      <div class="editor-group">
        <label>Y Offset (Parallax)</label>
        <div class="editor-row">
          <input type="range" id="edit-y" min="-5000" max="5000" value="0">
          <input type="number" id="edit-y-val" value="0">
        </div>
      </div>

      <div class="editor-group">
        <label>X Offset (Horizontal)</label>
        <div class="editor-row">
          <input type="range" id="edit-x" min="-5000" max="5000" value="0">
          <input type="number" id="edit-x-val" value="0">
        </div>
      </div>

      <div class="editor-group">
        <label>Opacity (Start -> End)</label>
        <div class="editor-row">
          <input type="number" id="edit-opacity-start" min="0" max="1" step="0.1" value="1" placeholder="Start">
          <span>-></span>
          <input type="number" id="edit-opacity-end" min="0" max="1" step="0.1" value="1" placeholder="End">
        </div>
      </div>

      <div class="editor-group">
        <label>Scroll Trigger (Start -> End Y)</label>
        <div class="editor-row">
          <input type="number" id="edit-scroll-start" value="0" placeholder="Start px">
          <span>-></span>
          <input type="number" id="edit-scroll-end" value="1000" placeholder="End px">
        </div>
      </div>

      <div class="editor-group">
        <label>Animation Smoothness (Scrub Time)</label>
        <div class="editor-row">
          <input type="range" id="edit-scrub" min="0" max="5" step="0.1" value="0">
          <input type="number" id="edit-scrub-val" value="0">
          <span style="font-size: 0.7rem; color: #a1a1a6;">(0 = Instant)</span>
        </div>
      </div>

      <div class="editor-actions">
        <button id="editor-export-btn" class="hud-btn primary" style="width: 100%;">Copy Final Config</button>
      </div>
    </div>
  </div>

  <!-- External JS Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

  <!-- Main Application Script -->
  <script src="app.js"></script>
  <script src="editor.js"></script>

  <!-- Live Auto-Reload Script -->
  <script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      const liveReloadSource = new EventSource('/api/reload');
      liveReloadSource.onmessage = (e) => {
        if (e.data === 'reload') {
          console.log('[Live Reload] Code change detected. Auto-refreshing...');
          window.location.reload();
        }
      };
    }
  </script>
</body>

</html>
